name: Deploy alert
# Turns a failed production deploy into a GitHub issue within a minute, instead of
# waiting for the daily site check (which cannot see a deploy that failed and left
# the previous version live). The issue e-mails the owner; the first green deploy
# closes it. Mirrors the "Site check failing" issue in site-monitor.yml.
'on':
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages on merge"]
    types: [completed]

# Alert runs for back-to-back deploys can finish out of order. Serialize them, and
# decide from the latest completed deploy (below), not from the run that triggered
# this one, so an older success can never close the issue of a newer failure.
concurrency:
  group: deploy-alert
  cancel-in-progress: false

jobs:
  alert:
    # Only real outcomes on main; skipped and cancelled runs say nothing.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The latest deploy on main that actually finished: success or failure.
          read -r conclusion sha url < <(gh run list --repo "$REPO" \
            --workflow cloudflare-pages-merge.yml --branch main --status completed \
            --limit 20 --json conclusion,headSha,url \
            --jq 'map(select(.conclusion == "success" or .conclusion == "failure")) | (.[0] // empty) | "\(.conclusion) \(.headSha) \(.url)"')
          # No finished deploy to judge (all cancelled or skipped): leave the issue alone.
          [[ ${conclusion:-} == success || ${conclusion:-} == failure ]] || exit 0
          title="Production deploy failing"
          num=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [[ $conclusion == failure ]]; then
            body="The production deploy of \`${sha:0:7}\` failed, so shykov.dev may still serve the previous version. [Run log]($url)"
            if [[ -n $num ]]; then
              gh issue comment "$num" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          elif [[ -n $num ]]; then
            gh issue close "$num" --repo "$REPO" --comment "Recovered: \`${sha:0:7}\` is live. [Run log]($url)"
          fi
