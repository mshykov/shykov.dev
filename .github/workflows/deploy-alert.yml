name: Deploy alert
# Turns a failed production deploy into a GitHub issue within a minute, instead of
# waiting for the daily site check (which cannot see a deploy that failed and left
# the previous version live). The issue e-mails the owner; the first green deploy
# closes it. Mirrors the "Site check failing" issue in site-monitor.yml.
'on':
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages on merge"]
    types: [completed]

jobs:
  alert:
    # Only real outcomes on main; skipped and cancelled runs say nothing.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Production deploy failing"
          num=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [[ $CONCLUSION == failure ]]; then
            body="The production deploy of \`${SHA:0:7}\` failed, so shykov.dev may still serve the previous version. [Run log]($RUN_URL)"
            if [[ -n $num ]]; then
              gh issue comment "$num" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          elif [[ -n $num ]]; then
            gh issue close "$num" --repo "$REPO" --comment "Recovered: \`${SHA:0:7}\` is live. [Run log]($RUN_URL)"
          fi
