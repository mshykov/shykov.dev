name: SonarCloud
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# One run per ref. On a PR a new push cancels the superseded run. On main a
# running analysis is never cancelled, but a newer push replaces one still
# *queued* — intended: the newest main analysis covers the skipped commit, and
# analysing each intermediate one would only spend minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # GitHub withholds repo secrets from Dependabot- and fork-triggered runs,
      # so SONAR_TOKEN is empty there. `sonarcloud` is a required check, so the
      # job must still pass: skip the scan when the token is absent (main is
      # re-scanned on the post-merge push anyway) and run the full gate whenever
      # the token is present.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
      - name: Skipped (no SONAR_TOKEN)
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN unavailable (Dependabot or fork run) — skipping scan; main push will re-scan."
