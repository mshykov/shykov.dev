name: Deploy to Cloudflare Pages on merge
'on':
  push:
    branches:
      - main
    # Docs/config-only merges change nothing that ships — don't redeploy for them.
    # Root-level *.md only: markdown under src/ or apps/ can be site content.
    # Manual redeploy stays available via workflow_dispatch.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".claude/**"
      - ".agents/**"
      # The site monitor ships nothing either.
      - ".github/workflows/site-monitor.yml"
      - "scripts/site-check.sh"
  workflow_dispatch: {}
# One production deploy at a time, never cancelled midway: the freshness check
# below compares the live site with this run's commit, so two overlapping runs
# would each fail the other's check. A newer pending run replaces an older one.
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    # Production deploys only from main. A manual run on another branch would
    # otherwise publish unreviewed code to production; skipped, not failed, so
    # it costs no runner minutes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build Project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: '${{ secrets.VITE_FIREBASE_API_KEY }}'
          VITE_FIREBASE_AUTH_DOMAIN: '${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}'
          VITE_FIREBASE_PROJECT_ID: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}'
          VITE_FIREBASE_STORAGE_BUCKET: '${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}'
          VITE_FIREBASE_APP_ID: '${{ secrets.VITE_FIREBASE_APP_ID }}'
          VITE_FIREBASE_MEASUREMENT_ID: '${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}'
      # Stamp the build with the commit it came from, so the live site can be
      # asked which commit it is serving (see the verify step).
      - name: Stamp build with commit
        run: echo "$GITHUB_SHA" > dist/build-sha.txt
      # Cloudflare occasionally answers "Unknown internal error" (2026-10-12) and
      # a rerun passes, so retry once before failing the run.
      - name: Deploy to Cloudflare Pages
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          command: pages deploy dist --project-name=shykov-dev --branch=main
      - name: Deploy to Cloudflare Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          command: pages deploy dist --project-name=shykov-dev --branch=main
      # A green deploy step only says wrangler finished. Ask the live site which
      # commit it serves; an unknown path falls back to the SPA shell, so a stale
      # or missing stamp fails the match instead of passing on a 200.
      - name: Verify the live site serves this commit
        run: |
          deadline=$((SECONDS + 120))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            live=$(curl -fsS --max-time 5 "https://shykov.dev/build-sha.txt?run=${GITHUB_RUN_ID}-${attempt}" || true)
            if [[ $live == "$GITHUB_SHA" ]]; then
              echo "Live site serves $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: live serves '${live:0:60}', expected $GITHUB_SHA"
            # Sleep only if another attempt still fits inside the deadline.
            (( SECONDS + 10 < deadline )) || break
            sleep 10
          done
          echo "::error::shykov.dev did not start serving $GITHUB_SHA within 2 minutes"
          exit 1
